    .ring { stroke: #17171a; } .bg { fill: #f3efe6; }
    @media (prefers-color-scheme: dark) { .ring { stroke: #efeae0; } .bg { fill: #121214; } }
  </style>
  <rect class="bg" width="32" height="32" rx="7" />
  <circle class="ring" cx="14" cy="14" r="8" fill="none" stroke-width="2.6" />
  <path d="M10 14h8" stroke="#d9481f" stroke-width="2.6" stroke-linecap="round" />
  <path d="M20 20l6 6" stroke="#d9481f" stroke-width="3.2" stroke-linecap="round" />
</svg>
