<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AlgoLens AI — a competitive programming learning workspace with offline Demo Mode and optional Groq AI Analysis." />
    <title>AlgoLens · Read the problem, find the algorithm</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a light flash.
      (function () {
        try {
          var saved = localStorage.getItem('algolens-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
