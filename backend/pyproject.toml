[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "algolens-api"
version = "0.1.0"
description = "AlgoLens AI — offline demo and optional Groq analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "uvicorn>=0.34,<1.0",
    "python-dotenv>=1.0,<2.0",
    "groq>=1.7,<2.0",
    "scikit-learn>=1.6,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1.0"]
semantic = ["sentence-transformers>=5,<6"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
